  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    * { margin: 0; padding: 0; box-sizing: border-box; }\n    html { scroll-behavior: smooth; }\n    body { font-family: 'Space Grotesk', sans-serif; background: #F2EEE6; color: #16140F; line-height: 1.65; overflow-x: hidden; }\n    a { color: #BF4B0A; text-decoration: none; }\n    a:hover { color: #16140F; }\n    ::selection { background: #BF4B0A; color: #F2EEE6; }\n    .reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.85s cubic-bezier(0.16,1,0.3,1), transform 0.85s cubic-bezier(0.16,1,0.3,1); }\n    .reveal[data-in=\"1\"] { opacity: 1 !important; transform: translateY(0) !important; }\n    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.15s !important; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"progressBar\" style=\"position: fixed; top: 0; left: 0; height: 3px; background: #BF4B0A; width: 0%; z-index: 1001;\"><\u002Fdiv>\n\n<nav style=\"position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 3rem; background: rgba(242,238,230,0.88); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(22,20,15,0.08);\">\n  <a href=\"Neha Sharma Portfolio v3.dc.html\" style=\"font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;\">← Back to portfolio<\u002Fa>\n  <span style=\"font-family: 'Instrument Serif', serif; font-size: 1.2rem;\">Case Study <span style=\"color: #BF4B0A;\">01/04<\u002Fspan><\u002Fspan>\n<\u002Fnav>\n\n<header data-screen-label=\"CS Hero\" style=\"padding: 9rem 3rem 4rem; max-width: 1100px; margin: 0 auto;\">\n  <div class=\"reveal\" style=\"display: flex; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 1.6rem;\">\n    <span style=\"font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.5px; background: #16140F; color: #F2EEE6; padding: 5px 14px; border-radius: 100px;\">Enterprise SaaS<\u002Fspan>\n    <span style=\"font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.5px; border: 1px solid rgba(22,20,15,0.3); padding: 5px 14px; border-radius: 100px; color: #524E44;\">RBAC<\u002Fspan>\n    <span style=\"font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.5px; border: 1px solid rgba(22,20,15,0.3); padding: 5px 14px; border-radius: 100px; color: #524E44;\">AI Chatbot UX<\u002Fspan>\n    <span style=\"font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.5px; border: 1px solid rgba(22,20,15,0.3); padding: 5px 14px; border-radius: 100px; color: #524E44;\">B2B Portal<\u002Fspan>\n  <\u002Fdiv>\n  <h1 class=\"reveal\" style=\"font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(2.8rem, 6vw, 5.2rem); line-height: 1.04; margin-bottom: 1.4rem;\">FUSO Field Fix Portal <em style=\"color: #BF4B0A;\">&amp;<\u002Fem> HAWK<\u002Fh1>\n  <p class=\"reveal\" style=\"font-size: 1.25rem; color: #524E44; max-width: 700px; margin-bottom: 3rem;\">Designing one enterprise tool that serves three very different jobs — field technicians, service managers, and admins — plus an AI chatbot that HR teams actually trust.<\u002Fp>\n  <div class=\"reveal\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: rgba(22,20,15,0.12); border: 1px solid rgba(22,20,15,0.12);\">\n    <div style=\"background: #F2EEE6; padding: 1.2rem;\"><div style=\"font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: #6B665C; margin-bottom: 4px;\">My role<\u002Fdiv><div style=\"font-weight: 600; font-size: 0.92rem;\">Senior UI/UX Designer<\u002Fdiv><\u002Fdiv>\n    <div style=\"background: #F2EEE6; padding: 1.2rem;\"><div style=\"font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: #6B665C; margin-bottom: 4px;\">Client<\u002Fdiv><div style=\"font-weight: 600; font-size: 0.92rem;\">Mitsubishi FUSO · via Cubastion<\u002Fdiv><\u002Fdiv>\n    <div style=\"background: #F2EEE6; padding: 1.2rem;\"><div style=\"font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: #6B665C; margin-bottom: 4px;\">Timeline<\u002Fdiv><div style=\"font-weight: 600; font-size: 0.92rem;\">2025 – Present<\u002Fdiv><\u002Fdiv>\n    <div style=\"background: #F2EEE6; padding: 1.2rem;\"><div style=\"font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: #6B665C; margin-bottom: 4px;\">Tools<\u002Fdiv><div style=\"font-weight: 600; font-size: 0.92rem;\">Figma · FigJam · Figma Make<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"reveal\" style=\"max-width: 1100px; margin: 0 auto 5rem; padding: 0 3rem;\">\n  <div style=\"width: 100%; height: 520px; position: relative;\">\n    <x-import component-from-global-scope=\"image-slot\" id=\"fuso-hero\" shape=\"rounded\" radius=\"14\" placeholder=\"Drop the FUSO hero mockup here (dashboard overview)\" hint-size=\"100%,520px\"><\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section data-screen-label=\"Overview\" style=\"max-width: 1100px; margin: 0 auto; padding: 0 3rem 5rem;\">\n  <div style=\"display: grid; grid-template-columns: 240px 1fr; gap: 3rem;\">\n    <div class=\"reveal\" style=\"font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px; color: #BF4B0A; font-weight: 600;\">01 · Overview<\u002Fdiv>\n    <div>\n      <p class=\"reveal\" style=\"font-size: 1.15rem; margin-bottom: 1.2rem;\">Mitsubishi FUSO's dealer and service network ran field repairs on scattered spreadsheets, emails, and legacy tools. Technicians lost time logging fixes; managers had no live view of the pipeline; admins couldn't govern access cleanly.<\u002Fp>\n      <p class=\"reveal\" style=\"color: #524E44;\">I designed the MVP for a role-based enterprise portal — the Field Fix Portal — and in parallel led UX for the HAWK project: an AI chatbot embedded in the HR Admin Portal. Two products, one design language, entirely different mental models.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #16140F; color: #F2EEE6; padding: 5rem 3rem;\">\n  <div style=\"max-width: 1100px; margin: 0 auto;\">\n    <div class=\"reveal\" style=\"font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px; color: #A0A83C; font-weight: 600; margin-bottom: 2rem;\">02 · The problem<\u002Fdiv>\n    <p class=\"reveal\" style=\"font-family: 'Instrument Serif', serif; font-size: clamp(1.6rem, 3.4vw, 2.6rem); line-height: 1.3; max-width: 900px;\">How do you build <em style=\"color: #BF4B0A;\">one tool<\u002Fem> for a technician under a truck with greasy hands, a manager juggling twelve service centers, and an admin responsible for who sees what?<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 3rem;\">\n      <div class=\"reveal\" style=\"border: 1px solid rgba(242,238,230,0.15); padding: 1.6rem; border-radius: 6px;\">\n        <div style=\"font-family: 'Instrument Serif', serif; font-size: 1.4rem; color: #BF4B0A; margin-bottom: 0.6rem;\">Technician<\u002Fdiv>\n        <p style=\"font-size: 0.92rem; color: #B5B0A4;\">Needs speed and clarity in the field. Patchy connectivity, gloves on, no patience for nested menus.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"border: 1px solid rgba(242,238,230,0.15); padding: 1.6rem; border-radius: 6px;\">\n        <div style=\"font-family: 'Instrument Serif', serif; font-size: 1.4rem; color: #BF4B0A; margin-bottom: 0.6rem;\">Manager<\u002Fdiv>\n        <p style=\"font-size: 0.92rem; color: #B5B0A4;\">Needs a live pipeline view — which fixes are stuck, where, and why — with filters that match how they think.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"border: 1px solid rgba(242,238,230,0.15); padding: 1.6rem; border-radius: 6px;\">\n        <div style=\"font-family: 'Instrument Serif', serif; font-size: 1.4rem; color: #BF4B0A; margin-bottom: 0.6rem;\">Admin<\u002Fdiv>\n        <p style=\"font-size: 0.92rem; color: #B5B0A4;\">Needs airtight role governance — permissions that are auditable, explainable, and hard to get wrong.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Process\" style=\"max-width: 1100px; margin: 0 auto; padding: 5rem 3rem;\">\n  <div style=\"display: grid; grid-template-columns: 240px 1fr; gap: 3rem;\">\n    <div class=\"reveal\" style=\"font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px; color: #BF4B0A; font-weight: 600;\">03 · Process<\u002Fdiv>\n    <div>\n      <h3 class=\"reveal\" style=\"font-family: 'Instrument Serif', serif; font-size: 1.8rem; margin-bottom: 1rem;\">Role-first information architecture<\u002Fh3>\n      <p class=\"reveal\" style=\"color: #524E44; margin-bottom: 2rem;\">Before a single screen, I mapped what each role sees, does, and must never touch. RBAC shaped the navigation itself — not just permissions bolted on later. Each role gets a dashboard that surfaces only its decisions.<\u002Fp>\n      <div class=\"reveal\" style=\"width: 100%; height: 380px; position: relative; margin-bottom: 2.5rem;\">\n        <x-import component-from-global-scope=\"image-slot\" id=\"fuso-ia\" shape=\"rounded\" radius=\"12\" placeholder=\"Drop IA diagram / user flow map here\" hint-size=\"100%,380px\"><\u002Fx-import>\n      <\u002Fdiv>\n      <h3 class=\"reveal\" style=\"font-family: 'Instrument Serif', serif; font-size: 1.8rem; margin-bottom: 1rem;\">Error states before happy paths<\u002Fh3>\n      <p class=\"reveal\" style=\"color: #524E44; margin-bottom: 2rem;\">Field technicians work in basements and remote lots. I designed offline states, retry patterns, and recovery flows first — the happy path was the easy part. Every failure tells the user what happened and what to do next.<\u002Fp>\n      <div class=\"reveal\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2.5rem;\">\n        <div style=\"height: 300px; position: relative;\">\n          <x-import component-from-global-scope=\"image-slot\" id=\"fuso-wire-1\" shape=\"rounded\" radius=\"12\" placeholder=\"Drop wireframes — technician flow\" hint-size=\"100%,300px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"height: 300px; position: relative;\">\n          <x-import component-from-global-scope=\"image-slot\" id=\"fuso-wire-2\" shape=\"rounded\" radius=\"12\" placeholder=\"Drop wireframes — error &amp; offline states\" hint-size=\"100%,300px\"><\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <h3 class=\"reveal\" style=\"font-family: 'Instrument Serif', serif; font-size: 1.8rem; margin-bottom: 1rem;\">HAWK: AI with guardrails<\u002Fh3>\n      <p class=\"reveal\" style=\"color: #524E44;\">For the HR chatbot, I used progressive disclosure to handle ambiguity and explicit confirmation for high-stakes actions like leave approvals. Conversational, but never careless. AI-assisted prototyping (Figma Make) let me test more chatbot flows in a week than a traditional cycle allows in a month.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Final UI\" style=\"max-width: 1100px; margin: 0 auto; padding: 0 3rem 5rem;\">\n  <div class=\"reveal\" style=\"font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px; color: #BF4B0A; font-weight: 600; margin-bottom: 2rem;\">04 · Final designs<\u002Fdiv>\n  <div style=\"display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;\">\n    <div class=\"reveal\" style=\"height: 400px; position: relative;\">\n      <x-import component-from-global-scope=\"image-slot\" id=\"fuso-ui-1\" shape=\"rounded\" radius=\"12\" placeholder=\"Drop final UI — manager dashboard\" hint-size=\"100%,400px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div class=\"reveal\" style=\"height: 400px; position: relative;\">\n      <x-import component-from-global-scope=\"image-slot\" id=\"fuso-ui-2\" shape=\"rounded\" radius=\"12\" placeholder=\"Drop final UI — mobile technician view\" hint-size=\"100%,400px\"><\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"reveal\" style=\"height: 380px; position: relative;\">\n    <x-import component-from-global-scope=\"image-slot\" id=\"fuso-ui-3\" shape=\"rounded\" radius=\"12\" placeholder=\"Drop final UI — HAWK chatbot conversation\" hint-size=\"100%,380px\"><\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #16140F; color: #F2EEE6; padding: 5rem 3rem;\">\n  <div style=\"max-width: 1100px; margin: 0 auto;\">\n    <div class=\"reveal\" style=\"font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px; color: #A0A83C; font-weight: 600; margin-bottom: 2.5rem;\">05 · Outcomes<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-bottom: 3rem;\">\n      <div class=\"reveal\">\n        <div style=\"font-family: 'Instrument Serif', serif; font-size: 3.2rem; color: #BF4B0A;\">6 wks<\u002Fdiv>\n        <p style=\"font-size: 0.92rem; color: #B5B0A4;\">Design-to-handoff cycle for the MVP, without sacrificing system rigor.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\">\n        <div style=\"font-family: 'Instrument Serif', serif; font-size: 3.2rem; color: #BF4B0A;\">3 roles<\u002Fdiv>\n        <p style=\"font-size: 0.92rem; color: #B5B0A4;\">One design language serving technician, manager, and admin — each with its own task-first flow.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\">\n        <div style=\"font-family: 'Instrument Serif', serif; font-size: 3.2rem; color: #BF4B0A;\">1 system<\u002Fdiv>\n        <p style=\"font-size: 0.92rem; color: #B5B0A4;\">Scalable component library built to absorb the 5+ modules planned next.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"reveal\" style=\"border-left: 3px solid #BF4B0A; padding-left: 1.8rem;\">\n      <p style=\"font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.5rem; line-height: 1.4;\">\"One interface can't fit all roles — but one design language absolutely can.\"<\u002Fp>\n      <p style=\"font-size: 0.85rem; color: #B5B0A4; margin-top: 0.6rem;\">What this project taught me about designing for fragmented networks.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"padding: 4rem 3rem; max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem;\">\n  <a href=\"Neha Sharma Portfolio v3.dc.html\" style=\"font-size: 0.95rem; font-weight: 600;\">← All work<\u002Fa>\n  <a href=\"Honda HMIC Case Study.dc.html\" style=\"font-family: 'Instrument Serif', serif; font-size: 1.6rem; display: inline-flex; align-items: center; gap: 12px;\">Next: Honda HMIC Ecosystem <span style=\"color: #BF4B0A;\">→<\u002Fspan><\u002Fa>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const bar = document.getElementById('progressBar');\n    window.addEventListener('scroll', () => {\n      const st = window.scrollY, dh = document.documentElement.scrollHeight - window.innerHeight;\n      if (bar) bar.style.width = (dh > 0 ? (st / dh) * 100 : 0) + '%';\n    }, { passive: true });\n    // Self-healing reveal loop: survives DC re-renders that replace nodes\n    const revealTick = () => {\n      document.querySelectorAll('.reveal:not([data-in])').forEach((el) => {\n        const r = el.getBoundingClientRect();\n        if (r.top < window.innerHeight * 0.92 && r.bottom > 0) {\n          el.setAttribute('data-in', '1');\n        }\n      });\n      requestAnimationFrame(revealTick);\n    };\n    requestAnimationFrame(revealTick);\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
